services:
  postgres:
    image: postgres:16-alpine
    container_name: verity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verity_admin
      POSTGRES_PASSWORD: verity_secure_password_2026
      POSTGRES_DB: verity_attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity_admin -d verity_attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verity_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://verity_admin:verity_secure_password_2026@postgres:5432/verity_attendance?schema=public"
      JWT_SECRET: "verity-super-secret-jwt-key-attendance-2026"
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: verity_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
